# E2E Test Configuration for Picture Book Management System
# ==========================================================

# Test execution settings
testExecution {
    # Parallel execution for faster tests
    parallelTests = true
    maxParallelForks = 4

    # Retry flaky tests
    retryFlakyTests = true
    maxRetries = 2

    # Test timeout (milliseconds)
    testTimeout = 300000  # 5 minutes per test
}

# Artifact collection
artifacts {
    # Enable screenshot capture
    screenshots = true
    screenshotOnFailure = true
    screenshotOnSuccess = false  # Set to true for debugging

    # Enable video recording (headed mode only)
    videoRecording = false
    videoOnFailure = true

    # Enable trace collection
    traces = true
    traceMode = "on-first-retry"  # Options: off, on, on-first-retry, retain-on-failure

    # Artifact output directory
    outputDirectory = "build/test-artifacts"
}

# Test coverage
coverage {
    enabled = true
    includeTests = true
    htmlReport = true
    xmlReport = true

    # Minimum coverage threshold
    minimumCoverage = 80

    # Packages to include in coverage
    includePackages = [
        "com.maomaochongapp.picturebook.**"
    ]

    # Classes to exclude from coverage
    excludeClasses = [
        "**.*Test",
        "**.*Test\$*",
        "**.di.**",
        "**.model.**",
        "**.entity.**"
    ]
}

# Test reporting
reporting {
    # JUnit XML format for CI integration
    junitXml = true
    junitXmlPath = "build/test-results/test"

    # HTML report
    htmlReport = true
    htmlReportPath = "build/reports/e2e-tests"

    # Console output
    consoleOutput = true
    consoleOutputFormat = "full"  # Options: short, full, verbose
}

# Test filters
filters {
    # Include patterns
    includePatterns = [
        "com.maomaochongapp.picturebook.e2e.**"
    ]

    # Exclude patterns (for flaky tests during development)
    excludePatterns = []

    # Tags for test categorization
    tags {
        include = ["@critical", "@smoke", "@regression"]
        exclude = ["@wip", "@disabled"]
    }
}

# Emulator/Device configuration
device {
    # Use Android emulator
    useEmulator = true

    # Emulator configuration
    emulator {
        avdName = "Pixel_6_API_34"
        apiLevel = 34
        device = "pixel_6"
    }

    # Or use connected device
    useConnectedDevice = false

    # Wait for emulator to boot
    waitForBootTimeout = 120000  # 2 minutes
}

# Security testing
security {
    # Validate URI schemes
    validateUriSchemes = true
    trustedAuthorities = [
        "com.android.externalstorage.documents",
        "com.android.providers.downloads.documents",
        "com.android.providers.media.documents"
    ]

    # Input sanitization tests
    testInputSanitization = true
    testSqlInjection = true
    testXssPrevention = true
}

# Performance thresholds
performance {
    # Maximum test duration per test class (seconds)
    maxTestDuration = 60

    # Maximum time to create a book (ms)
    maxBookCreationTime = 5000

    # Maximum time to load images (ms)
    maxImageLoadTime = 3000

    # Maximum time for search operation (ms)
    maxSearchTime = 2000
}

# Flaky test management
flakyTests {
    # Enable flaky test detection
    detectionEnabled = true

    # Number of iterations for flaky detection
    detectionIterations = 10

    # Flakiness threshold (percentage of failures)
    flakinessThreshold = 20  # 20% failure rate = flaky

    # Auto-quarantine flaky tests
    autoQuarantine = false

    # Quarantine file path
    quarantineFile = "test-quarantine.properties"
}

# CI/CD integration
ci {
    # CI environment detection
    isCI = System.getenv("CI") != null

    # Upload artifacts to CI
    uploadArtifacts = true

    # Fail build on test failure
    failOnFailure = true

    # Publish test report
    publishReport = true

    # Notify on failure
    notifyOnFailure = false
}
